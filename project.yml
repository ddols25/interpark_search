name: InterparkSeatChecker
options:
  bundleIdPrefix: com.minseokkim
  deploymentTarget:
    iOS: "17.0"
targets:
  InterparkSeatChecker:
    type: application
    platform: iOS
    sources:
      - InterparkSeatChecker/Sources
    info:
      path: InterparkSeatChecker/Info.plist
      properties:
        CFBundleDisplayName: "인터파크 잔여석"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minseokkim.InterparkSeatChecker
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
