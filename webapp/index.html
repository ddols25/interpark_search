<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>인터파크 잔여석 알림</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2563eb" />
<style>
  :root {
    --bg: #0b1220;
    --card: #131c2e;
    --border: #223049;
    --text: #e7ecf5;
    --muted: #8b98ad;
    --accent: #2563eb;
    --accent-2: #dc2626;
    --avail: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  main { max-width: 480px; margin: 0 auto; padding-top: 20px; }
  h1 { font-size: 1.3rem; margin: 0 0 16px; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  .field { margin-bottom: 14px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0e1626;
    color: var(--text);
    font-size: 1rem;
  }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; cursor: pointer; }
  .checkbox-row input { width: 18px; height: 18px; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-danger { background: var(--accent-2); color: white; }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { font-size: 0.85rem; min-height: 1.2em; margin: 8px 0 0; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 0.8rem; }
  .card {
    background: #0e1626;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .card-title { font-weight: 600; margin-bottom: 6px; }
  .seat-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 0.9rem; }
  .avail { color: var(--avail); font-weight: 600; }
  .notice {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
    margin-top: 20px;
    line-height: 1.5;
  }
  .ios-tip {
    font-size: 0.8rem;
    color: var(--muted);
    background: #0e1626;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  #searchGoodsBtn { margin-top: 8px; }
  #searchResults {
    margin-top: 10px;
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .search-item {
    display: flex;
    gap: 10px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    align-items: center;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover, .search-item:active { background: #16223a; }
  .search-item.selected { background: #16223a; outline: 1px solid var(--accent); }
  .search-item img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
    background: #0e1626;
    flex-shrink: 0;
  }
  .search-item .info { min-width: 0; }
  .search-item .info .title {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .search-item .info .date { font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>인터파크 잔여석 알림</h1>

  <p class="ios-tip">
    📱 iPhone에서는 사파리로 이 페이지를 연 뒤 <strong>공유 → 홈 화면에 추가</strong>로 설치해야
    푸시 알림을 받을 수 있습니다 (iOS 16.4+). 홈 화면 아이콘으로 실행한 뒤 아래에서 구독하세요.
  </p>

  <div class="panel">
    <div class="field">
      <label for="goodsCode">인터파크 공연 ID</label>
      <input type="text" id="goodsCode" inputmode="numeric" placeholder="예: 26009084" value="26009084" />
      <button class="btn-secondary" id="searchGoodsBtn">🔍 공연 조회 (성남아트센터)</button>
      <div id="searchResults" hidden></div>
    </div>
    <div class="field">
      <label for="interval">자동조회 주기 (분, 최소 1분)</label>
      <input type="number" id="interval" min="1" value="10" />
    </div>
    <label class="checkbox-row" for="quietHours">
      <input type="checkbox" id="quietHours" />
      야간(24시~07시) 알림 끄기
    </label>

    <button class="btn-primary" id="subscribeBtn">구독 시작 / 설정 저장</button>
    <button class="btn-danger" id="unsubscribeBtn">이 기기 알림 끄기</button>
    <button class="btn-secondary" id="swaBtn">사파리로 성남아트센터 열기</button>
    <p id="status"></p>
  </div>

  <div class="panel" id="resultPanel">
    <div id="lastResult">
      <p class="muted">조회 결과가 여기에 표시됩니다.</p>
    </div>
  </div>

  <p class="notice">
    조회 전용입니다. 예매·결제는 인터파크 앱/사이트에서 직접 진행하세요.<br />
    실제 조회는 서버(Supabase Edge Function)에서 주기적으로 실행되며, 이 페이지를 닫아도 계속 동작합니다.
  </p>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
